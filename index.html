<style>

  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171a; --surface:#192226; --ink:#e7e3d6; --muted:#98a4a6; --line:#2b383d;
  --accent:#5fb39b; --accent-ink:#0c1915; --gold:#d6ad52;
  --strong:#5fbf88; --partial:#e0a44a; --forgot:#e2756c; --none:#2f3b40; --pen:#ff5a50; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171a; --surface:#192226; --ink:#e7e3d6; --muted:#98a4a6; --line:#2b383d;
  --accent:#5fb39b; --accent-ink:#0c1915; --gold:#d6ad52;
  --strong:#5fbf88; --partial:#e0a44a; --forgot:#e2756c; --none:#2f3b40; --pen:#ff5a50; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:620px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:0 170px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line);margin-bottom:14px}
.top h1{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0}
.top p{margin:0;color:var(--muted);font-size:.85rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.note{font-size:.85rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:center;padding:8px 4px;border-radius:10px;background:var(--bg)}
.stat b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 8px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.c-strong{color:var(--strong)} .c-partial{color:var(--partial)} .c-forgotten{color:var(--forgot)} .c-none{color:var(--muted)}

button.small{padding:5px 9px;font-size:.82rem}

:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.heat button.strong{background:var(--strong)} .heat button.partial{background:var(--partial)} .heat button.forgotten{background:var(--forgot)}

.reclist .item{align-items:flex-start}

<div class="wrap">
  <div class="top" id="top"><h1>Hifz Revival</h1><p id="sub">Ramadan 2027</p></div>

<script>
/* ---------- PDF page extractor: reads JPEG page scans straight out of the user's own PDF ---------- */
async function indexPdfPages(blob, onProgress){
  // One forward pass over the file: no jumping around, so it is fast even on files picked from Android storage.
  const reader=blob.stream().getReader(),dec=new TextDecoder('latin1'),out=[];
  let buf='',base=0,read=0,state='find',cur=null,from=0,lastP=-1;
  for(;;){
    const {done,value}=await reader.read();
    if(value){buf+=dec.decode(value,{stream:true});read+=value.length}
    let again=true;
    while(again){again=false;
      if(state==='find'){const i=buf.indexOf('DCTDecode',from);
        if(i!==-1){const o=buf.lastIndexOf(' obj',i),head=o>0?buf.slice(Math.max(0,o-12),o):'',n=parseInt((head.match(/(\d+)\s+0$/)||[])[1],10);
          cur={num:isNaN(n)?out.length:n};state='stream';from=i+9;again=true}
        else from=Math.max(from,buf.length-16)}
      else if(state==='stream'){const k=buf.indexOf('stream',from);
        if(k!==-1&&k+10<=buf.length){let d=k+6;if(buf[d]==='\r')d++;if(buf[d]==='\n')d++;
          if(buf.charCodeAt(d)===0xff&&buf.charCodeAt(d+1)===0xd8){cur.start=base+d;state='end';from=d+2}else{state='find';from=d}again=true}
        else if(k===-1)from=Math.max(from,buf.length-8)}
      else{const e=buf.indexOf('endstream',from);
        if(e!==-1){const t0=Math.max(0,cur.start-base,e-16),ff=buf.slice(t0,e).lastIndexOf('\xff\xd9');
          cur.end=ff===-1?base+e:base+t0+ff+2;out.push(cur);cur=null;state='find';from=e+9;again=true}
        else from=Math.max(from,buf.length-16)}
    }
    const cut=Math.min(from,Math.max(0,buf.length-4096));
    if(cut>0){buf=buf.slice(cut);base+=cut;from-=cut}
    const pr=Math.floor(read/blob.size*100);if(pr!==lastP){lastP=pr;onProgress&&onProgress(read/blob.size)}
    if(done)break;
  }
  out.sort((x,y)=>x.num-y.num);
  return out.map(f=>[f.start,f.end]);
}

/* ---------- Local storage (IndexedDB) ---------- */
let dbp=null;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{const r=indexedDB.open('hifz-revival',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbp}
async function iget(k){try{const d=await db();return await new Promise((res,rej)=>{const r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return undefined}}
async function iput(k,v){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function idel(k){try{const d=await db();await new Promise(res=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=res})}catch(e){}}

function ymd(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}

function mmss(sec){sec=Math.max(0,Math.floor(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')}

/* ---------- Sabaq, Sabaqi, Manzil ---------- */
const memPages=()=>Object.keys(S.mem).map(Number).sort((a,b)=>a-b);
function nextUnmem(p){for(let q=Math.max(F(),p);q<=L();q++)if(!S.mem[q])return q;return null}
function sabaqiList(){const t=ymd();
  return Object.keys(S.mem).map(Number).filter(p=>S.mem[p].src==='sabaq'&&S.mem[p].d<t)
    .sort((a,b)=>S.mem[b].d.localeCompare(S.mem[a].d)||b-a).slice(0,S.settings.sabaqiPages).sort((a,b)=>a-b)}
function todayPlan(){
  const t=ymd();
  if(!S.today||S.today.date!==t||!S.today.v2){
    const sab=[];let p=nextUnmem(S.sabaqPtr||F());for(let i=0;i<S.settings.sabaqPerDay&&p!=null;i++){sab.push(p);p=nextUnmem(p+1)}
    const sq=sabaqiList(),pool=memPages().filter(x=>!sq.includes(x)&&!sab.includes(x)),man=[];
    if(pool.length){let i=pool.findIndex(x=>x>=(S.manzilPtr||0));if(i<0)i=0;for(let k=0;k<Math.min(S.settings.manzilPerDay,pool.length);k++)man.push(pool[(i+k)%pool.length])}
    S.today={date:t,v2:1,sabaq:sab,sabaqi:sq,manzil:man,batch:sab};save();
  }
  return S.today;
}
function stageOf(p){const P=todayPlan();return P.sabaq.includes(p)?'sabaq':P.sabaqi.includes(p)?'sabaqi':P.manzil.includes(p)?'manzil':S.mem[p]?'memorized':'new'}
const STAGE={sabaq:'Sabaq today',sabaqi:'Sabaqi today',manzil:'Manzil today',memorized:'Memorized',new:'Not memorized yet'};
function memorize(p){S.mem[p]={d:ymd(),src:'sabaq'};if(p>=(S.sabaqPtr||F())){S.sabaqPtr=nextUnmem(p+1)||p}save()}
function parseRanges(txt){const out=new Set();for(const part of String(txt||'').split(/[,\s]+/)){const m=part.match(/^(\d+)(?:-(\d+))?$/);if(!m)continue;
  let a=+m[1],b=m[2]?+m[2]:a;if(a>b)[a,b]=[b,a];for(let q=Math.max(F(),a);q<=Math.min(L(),b);q++)out.add(q)}return out}
function toRanges(arr){const r=[];let a=null,b=null;for(const q of arr){if(a===null){a=b=q}else if(q===b+1)b=q;else{r.push(a===b?a:a+'-'+b);a=b=q}}if(a!==null)r.push(a===b?a:a+'-'+b);return r.join(', ')}
/* Juz start pages in this 15-line mushaf (read from its page headers) */
const JUZ=[2];for(let k=2;k<=29;k++)JUZ.push(23+20*(k-2));JUZ.push(587);
function juzOf(p){let j=1;for(let k=0;k<30;k++)if(p>=JUZ[k])j=k+1;return j}
function markKey(m){let y=1,x=0;for(const q of m.pts){if(q[1]<y)y=q[1]}for(const q of m.pts)x=Math.max(x,q[0]);return [y,x]}
function sortedMarks(p){return (S.marks[p]||[]).slice().sort((a,b)=>{const A=markKey(a),B=markKey(b);return Math.abs(A[0]-B[0])>.012?A[0]-B[0]:B[1]-A[1]})}
function numbering(){const map={},byJ=S.settings.mkNum==='juz',cnt={};
  Object.keys(S.marks).map(Number).sort((a,b)=>a-b).forEach(p=>{const j=juzOf(p);let k=0;sortedMarks(p).forEach(m=>{const n=byJ?(cnt[j]=(cnt[j]||0)+1):++k;map[m.id]={n,j,p}})});return map}
function mkLabel(info){return S.settings.mkNum==='juz'?'Juz '+info.j+' · #'+info.n:'Page '+info.p+' · #'+info.n}
function openMarks(p){return (S.marks[p]||[]).filter(m=>!m.fixed)}
function reviewsDue(){
  const t=ymd(),P=todayPlan(),batch=[...P.sabaq,...P.sabaqi,...P.manzil],out=[];
  for(const k in S.pages){const p=+k,x=S.pages[k];if(batch.includes(p))continue;
    if(x.next&&x.next<=t&&(x.cat!=='strong'||openMarks(p).length))out.push(p)}
  for(const k in S.marks){const p=+k;if(!out.includes(p)&&!batch.includes(p)&&openMarks(p).length&&!(S.pages[p]&&S.pages[p].next>t))out.push(p)}
  const ord={forgotten:0,partial:1,strong:2};
  return out.sort((a,b)=>(ord[(S.pages[a]||{}).cat]??1)-(ord[(S.pages[b]||{}).cat]??1)||a-b).slice(0,S.settings.reviewMax);
}
function ratePage(p,cat){
  const t=ymd(),x=S.pages[p]||(S.pages[p]={hist:[]});
  x.cat=cat;x.last=t;x.next=GAP[cat]?addDays(t,GAP[cat]):null;x.hist.push({d:t,r:cat});
  const P=todayPlan(),i=P.manzil.indexOf(p);
  if(i>=0&&i>=(P.manDone??-1)){P.manDone=i;S.manzilPtr=p+1}
  save();
}
function doneToday(){const t=ymd();return Object.keys(S.pages).filter(k=>S.pages[k].last===t).length}

/* ---------- Page images ---------- */
const urlCache=new Map();
async function pageURL(p){
  if(!pdfBlob||!pdfIdx)return null;
  const i=S.settings.firstPdf-1+(p-F());if(i<0||i>=pdfIdx.length)return null;
  if(urlCache.has(i))return urlCache.get(i);
  const [a,b]=pdfIdx[i],u=URL.createObjectURL(new Blob([pdfBlob.slice(a,b)],{type:'image/jpeg'}));
  urlCache.set(i,u);if(urlCache.size>12){const k=urlCache.keys().next().value;URL.revokeObjectURL(urlCache.get(k));urlCache.delete(k)}
  return u;
}
async function loadPdf(file){
  const box=()=>$('#pdfStatus');const say=m=>{const b=box();if(b)b.textContent=m};
  const btns=document.querySelectorAll('[data-act=pickPdf]');btns.forEach(b=>b.disabled=true);
  try{
    // Step 1: keep a copy inside the app (one straight read of the file)
    say('Step 1 of 2: copying your mushaf into the app ('+Math.round(file.size/1048576)+' MB). Keep this screen open…');
    let src=file;
    try{try{navigator.storage&&navigator.storage.persist&&await navigator.storage.persist()}catch(e){}
      await iput('pdf',file);src=await iget('pdf')||file}
    catch(e){src=file;say('Could not keep a copy inside the app ('+(e&&e.name||'storage')+'). Continuing for this session only…')}
    // Step 2: find the page images
    const idx=await indexPdfPages(src,f=>say('Step 2 of 2: finding pages… '+Math.round(f*100)+'%'));
    if(idx.length<20){say('This PDF does not look like a scanned mushaf. No page images were found.');await idel('pdf');return}
    try{await iput('pdfIdx',idx)}catch(e){}
    pdfBlob=src;pdfIdx=idx;urlCache.forEach(u=>URL.revokeObjectURL(u));urlCache.clear();
    toast(idx.length+' page images found');render();
  }catch(e){say('Could not read this PDF ('+(e&&(e.message||e.name)||'error')+'). Try choosing it again.')}
  finally{btns.forEach(b=>b.disabled=false)}
}

function segmentEnergy(E,fr,o){
  const n=E.length;if(n<10)return{cuts:[],start:0,end:n*fr};
  const sm=new Float32Array(n);
  for(let i=0;i<n;i++){let s=0,c=0;for(let j=Math.max(0,i-2);j<=Math.min(n-1,i+2);j++){s+=20*Math.log10(E[j]+1e-7);c++}sm[i]=s/c}
  const srt=Array.from(sm).sort((a,b)=>a-b),pct=q=>srt[Math.min(n-1,Math.floor(q*n))];
  const lo=pct(.08),hi=pct(.95),thr=lo+(hi-lo)*(o.thr||.3);
  let fs=-1,le=-1;for(let i=0;i<n;i++)if(sm[i]>=thr){if(fs<0)fs=i;le=i}
  if(fs<0)return{cuts:[],start:0,end:n*fr};
  const runs=[];let st=-1;
  for(let i=fs;i<=le;i++){const q=sm[i]<thr;if(q&&st<0)st=i;if(!q&&st>=0){runs.push({a:st*fr,b:i*fr,len:(i-st)*fr});st=-1}}
  const start=fs*fr,end=(le+1)*fr;let cuts;
  if(o.count){cuts=runs.filter(r=>r.len>=.15).sort((x,y)=>y.len-x.len).slice(0,Math.max(0,o.count-1))}
  else{cuts=runs.filter(r=>r.len>=o.minPause);
    let changed=true;
    while(changed&&cuts.length){changed=false;cuts.sort((x,y)=>x.a-y.a);
      for(let k=0;k<=cuts.length;k++){const t0=k?cuts[k-1].b:start,t1=k<cuts.length?cuts[k].a:end;
        if(t1-t0<.6){const L=k?cuts[k-1]:null,Rr=k<cuts.length?cuts[k]:null,rm=!L?Rr:!Rr?L:(L.len<Rr.len?L:Rr);cuts.splice(cuts.indexOf(rm),1);changed=true;break}}}}
  cuts.sort((x,y)=>x.a-y.a);
  return{cuts:cuts.map(c=>({a:c.a,b:c.b})),start,end};
}

/* ---------- Transfer file (ZIP, no compression) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

  const parts=[],cd=[],enc=new TextEncoder(),d=new Date();let off=0;
  const tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(let k=0;k<files.length;k++){
    const f=files[k],name=enc.encode(f.name),crc=await crcBlob(f.blob),sz=f.blob.size;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);
    h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,name.length,true);
    parts.push(h.buffer,name,f.blob);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);
    c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    cd.push(c.buffer,name);off+=30+name.length+sz;onp&&onp((k+1)/files.length);
  }
  const cdSize=cd.reduce((n,x)=>n+x.byteLength,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,e.buffer],{type:'application/zip'});

async function readZip(blob){
  const tl=Math.min(blob.size,66000),tail=new DataView(await blob.slice(blob.size-tl).arrayBuffer());let p=-1;
  for(let i=tl-22;i>=0;i--)if(tail.getUint32(i,true)===0x06054b50){p=i;break}
  if(p<0)throw new Error('This is not a Hifz Revival transfer file.');
  const n=tail.getUint16(p+10,true),cs=tail.getUint32(p+12,true),co=tail.getUint32(p+16,true);
  const cd=new DataView(await blob.slice(co,co+cs).arrayBuffer()),dec=new TextDecoder(),out={};let q=0;
  for(let k=0;k<n;k++){
    if(cd.getUint32(q,true)!==0x02014b50)throw new Error('The transfer file is damaged.');
    const method=cd.getUint16(q+10,true),size=cd.getUint32(q+20,true),nl=cd.getUint16(q+28,true),el=cd.getUint16(q+30,true),cl=cd.getUint16(q+32,true),lo=cd.getUint32(q+42,true);
    const name=dec.decode(new Uint8Array(cd.buffer,q+46,nl)),lh=new DataView(await blob.slice(lo,lo+30).arrayBuffer());
    const start=lo+30+lh.getUint16(26,true)+lh.getUint16(28,true);

const extFor=m=>(m||'').includes('mp4')?'m4a':(m||'').includes('ogg')?'ogg':(m||'').includes('mpeg')?'mp3':(m||'').includes('wav')?'wav':'webm';
const safeName=t=>String(t).replace(/[^\w\- .()]+/g,'_').slice(0,60);
let tx=null,imp=null;
async function buildTransfer(withPdf){
  const say=m=>{const b=$('#txStatus');if(b)b.textContent=m};
  say('Collecting recordings…');
  const files=[],audio={},energy={};
  for(const r of S.recs){if(r.src)continue;
    if(r.auto){const e=await iget('energy:'+r.id);if(e){const en='hifz-revival/energy/'+r.id+'.f32';energy[r.id]=en;files.push({name:en,blob:new Blob([e])})}}
    const b=await iget('audio:'+r.id);if(!b)continue;const nm='hifz-revival/recordings/'+r.date+' '+safeName(r.title)+'__'+r.id+'.'+extFor(r.mime);audio[r.id]=nm;files.push({name:nm,blob:b})}
  if(withPdf&&pdfBlob)files.push({name:'hifz-revival/mushaf.pdf',blob:pdfBlob});
  files.unshift({name:'hifz-revival/progress.json',blob:new Blob([JSON.stringify({app:'hifz-revival',format:1,exported:new Date().toISOString(),state:S,audio,energy,pdfIdx:withPdf&&pdfBlob?pdfIdx:null})],{type:'application/json'})});
  const zip=await makeZip(files,f=>say('Packing… '+Math.round(f*100)+'%'));
  tx={blob:zip,name:'hifz-revival-transfer-'+ymd()+'.zip',recs:Object.keys(audio).length,pdf:withPdf&&!!pdfBlob};
  render();
}
async function openTransfer(file){

    if(/\.json$/i.test(file.name)||file.type==='application/json'){const v=JSON.parse(await file.text());const st=v.state||v;if(!st.settings||!st.pages)throw new Error('This file is not a Hifz Revival backup.');imp={state:st,files:{},audio:{},pdfIdx:null,name:file.name};}
    else{const files=await readZip(file),pj=files['hifz-revival/progress.json'];if(!pj)throw new Error('This ZIP is not a Hifz Revival transfer file.');
      if(Object.values(files).some(f=>f.method!==0))throw new Error('This ZIP was changed by another app. Send the original file again.');
      const v=JSON.parse(await pj.blob.text());imp={state:v.state,files,audio:v.audio||{},energy:v.energy||{},pdfIdx:v.pdfIdx,name:file.name};}

async function applyTransfer(){

  try{
    for(const r of S.recs)if(!st.recs.some(x=>x.id===r.id))await idel('audio:'+r.id);
    for(const r of st.recs){const f=imp.files[imp.audio[r.id]];if(f){say('Copying recordings… '+(++n)+' of '+st.recs.length);await iput('audio:'+r.id,new Blob([f.blob],{type:r.mime||'audio/webm'}))}}
    for(const id in (imp.energy||{})){const f=imp.files[imp.energy[id]];if(f)await iput('energy:'+id,new Float32Array(await f.blob.arrayBuffer()))}
    st.recs=st.recs.filter(r=>r.src||imp.audio[r.id]&&imp.files[imp.audio[r.id]]||!Object.keys(imp.files).length);
    st.recs=st.recs.filter(r=>!r.src||st.recs.some(x=>x.id===r.src));

    if(pf){say('Copying the mushaf…');const pb=new Blob([pf.blob],{type:'application/pdf'});const idx=imp.pdfIdx||await indexPdfPages(pb);await iput('pdf',pb);await iput('pdfIdx',idx);pdfBlob=await iget('pdf')||pb;pdfIdx=idx;urlCache.forEach(u=>URL.revokeObjectURL(u));urlCache.clear()}
    const myQ=S.qari;S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),st);S.settings=Object.assign({},DEFAULTS.settings,st.settings);S.today=null;
    if(S.qari){S.qari.prev=S.qari.files;S.qari.files={}}if(myQ&&Object.keys(myQ.files||{}).length)S.qari=myQ;

function vLanding(){
  $('#view').innerHTML=`<div class="landing"><div class="hero">${ICON}<h1>Hifz Revival</h1><p class="note" style="margin:0">Ramadan 2027 · page-by-page revision of your own mushaf</p></div>
  <section class="card"><ol class="steps">
   <li><div><b>Load your mushaf PDF</b><div class="note">Your own 15-line copy. Pages are read straight from it, so every page is your verified print.</div></div></li>
   <li><div><b>Recite, record, mark</b><div class="note">Record a whole surah and let the app split it into ayat. Mark each mistake on the exact word with a dated note.</div></div></li>
   <li><div><b>Sabaq, sabaqi, manzil</b><div class="note">A new lesson, your recent pages and your old revision every day, with weak pages brought back until Ramadan.</div></div></li></ol>
   <button class="primary" data-act="pickPdf" style="width:100%;margin-top:16px">Choose mushaf PDF</button>
   <p class="note" id="pdfStatus" aria-live="polite" style="margin:6px 0 0"></p>
   <button data-act="pickZip" style="width:100%;margin-top:8px">Moving from another phone? Import transfer file</button>
   ${transferBlocks()}</section>
  <p class="note" style="text-align:center">Everything stays on this phone and works offline.</p></div>`;
}
function vToday(){
  if(!pdfIdx){vLanding();return}
  const P=todayPlan(),rev=reviewsDue(),secs=liveSecs(),g=S.settings.goal*60;

function bindCanvas(){
  const c=$('#pcv');if(!c)return;let cur=null,down=null,erasing=false;

  const erase=q=>{const m=hitMark(q,.022);if(m){const a=S.marks[curPage];a.splice(a.indexOf(m),1);undoStack.push({op:'erase',p:curPage,m});save();drawMarks();refreshMarkCard()}};
  c.addEventListener('pointerdown',e=>{
    if(mode==='mark'&&!placing){c.setPointerCapture(e.pointerId);e.preventDefault();
      if(tool==='erase'){down=pt(e)}else cur={id:uid(),d:ymd(),type:tool,note:'',pts:[pt(e)]}}

    if(!down)return;const q=pt(e),tap=Math.abs(q[0]-down[0])+Math.abs(q[1]-down[1])<.03;down=null;if(!tap)return;
    if(placing){const r=S.recs.find(x=>x.id===placing);if(r){r.markers[0].x=+q[0].toFixed(4);r.markers[0].y=+q[1].toFixed(4);r.page=curPage;r.markers[0].page=curPage;save();toast('Placed '+r.title)}placing=null;drawDots();updatePageAudio();render();return}
    if(mode==='ayah'){ar.pos={page:curPage,x:+q[0].toFixed(4),y:+q[1].toFixed(4)};if(ar.recording)stopAyah(true);else{drawDots();renderDock()}return}
    if(mode==='tag'){if(tagNow(curPage,q[0],q[1])){drawDots();if(!rec.on)render()}return}
    if(mode==='mark'&&tool==='erase'){const m=hitMark(q,.035);selId=m?m.id:null;if(!m)toast('No mistake there. Tap directly on a mark or its note.');drawMarks();refreshTools();return}
    if(mode==='read'){const m=showMarks&&hitMark(q,.03);if(m)openSheet(curPage,m.id,false)}

function detect(count){if(review.kind==='qari'){const r=qAlign(review.surah,review.E,review.fr,review.thr,review.intro);if(r){review.cuts=r.cuts;review.start=r.start;review.end=r.end}review.dropped=new Set();return}

}

function reviewTick(){
  const w=$('#wave');if(!w||!review)return;const dpr=window.devicePixelRatio||1,W=Math.round(w.clientWidth*dpr),H=Math.round(w.clientHeight*dpr);
  if(w.width!==W||w.height!==H){w.width=W;w.height=H;review.cols=null}
  const E=review.E,n=E.length,fr=review.fr,dur=n*fr,g=w.getContext('2d'),css=getComputedStyle(document.documentElement),col=k=>css.getPropertyValue(k).trim();
  if(!review.cols){const c=new Float32Array(W);for(let x=0;x<W;x++){let m=0;const a=Math.floor(x/W*n),b=Math.max(a+1,Math.floor((x+1)/W*n));for(let i=a;i<b&&i<n;i++)if(E[i]>m)m=E[i];c[x]=20*Math.log10(m+1e-7)}
    const s=Array.from(c).sort((a,b)=>a-b);review.lo=s[Math.floor(W*.05)];review.hi=s[Math.floor(W*.98)];review.cols=c}
  g.clearRect(0,0,W,H);const list=segs();
  list.forEach((s,i)=>{g.fillStyle=s.drop?'rgba(128,128,128,.15)':(i%2?'rgba(31,92,78,.10)':'rgba(31,92,78,.20)');g.fillRect(s.t0/dur*W,0,(s.t1-s.t0)/dur*W,H)});
  g.fillStyle=col('--muted');for(let x=0;x<W;x++){const v=Math.max(0,Math.min(1,(review.cols[x]-review.lo)/(review.hi-review.lo||1)));const h=Math.max(1,v*H*.9);g.fillRect(x,(H-h)/2,1,h)}
  g.fillStyle=col('--gold');for(const c of review.cuts){g.fillRect(((c.a+c.b)/2)/dur*W-dpr,0,2*dpr,H)}
  g.fillStyle=col('--forgot');g.fillRect(au.currentTime/dur*W-dpr,0,2*dpr,H);
  const t=$('#revT');if(t)t.textContent=mmss(au.currentTime);const pp=$('#revPP');if(pp)pp.textContent=au.paused?'▶':'❚❚';
  const cur=list.findIndex(s=>au.currentTime>=s.t0&&au.currentTime<s.t1);

async function saveReview(){

  const pageAt0=t=>{let p=r.startPage;for(const m of pm)if(m.t<=t+.5)p=m.page;return p};
  let n=0;

      markers:[old?{...old}:{t:0,page,x:null,y:null,label:title}],startPage:page})}

    case 'pickZip':$('#zipIn').click();break;
    case 'ayStart':startAyah();break;
    case 'ayStop':stopAyah(false);break;
    case 'ayNext':stopAyah(true);break;
    case 'goAyah':mode='ayah';go('mushaf');renderDock();break;
    case 'mkTx':b.disabled=true;await buildTransfer($('#txPdf')&&$('#txPdf').checked);break;
    case 'shareTx':{const f=new File([tx.blob],tx.name,{type:'application/zip'});
      try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Hifz Revival transfer'});}else{throw new Error('noshare')}}
      catch(err){if(err&&err.name==='AbortError')break;toast('Sharing is not available here. Use Save to Downloads, then send the file.')}break}
    case 'saveTx':{const a=document.createElement('a');a.href=URL.createObjectURL(tx.blob);a.download=tx.name;document.body.appendChild(a);a.click();a.remove();toast('Saved to Downloads as '+tx.name);break}
    case 'applyImp':if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again: this replaces data here';break}b.disabled=true;await applyTransfer();break;
    case 'cancelImp':imp=null;render();break;
    case 'timer':toggleTimer();break;
    case 'recStart':startRec();break;
    case 'autoStart':{const sN=+$('#auS').value,st=Math.max(1,Math.min(AY[sN-1],parseInt($('#auA').value,10)||1));S.settings.autoSurah=sN;save();
      await startRec({surah:sN,start:st,intro:+$('#auI').value});break}
    case 'revCancel':review=null;au.pause();render();renderDock();break;
    case 'revSave':await saveReview();break;
    case 'revMatch':{const n=Math.max(1,parseInt($('#rvN').value,10)||1);detect(n+(INTRO[review.intro]||[]).length);vReview();toast('Split into the '+n+' clearest pauses');break}
    case 'revPP':player.a=null;player.b=null;player.q=null;if(au.paused)au.play().catch(()=>{});else au.pause();break;
    case 'revSplit':{const t=au.currentTime,s=segs().find(x=>t>x.t0+.3&&t<x.t1-.3);if(!s){toast('Move the playhead inside a clip first.');break}
      review.cuts.push({a:t,b:t});review.cuts.sort((x,y)=>x.a-y.a);au.pause();vReview();toast('Split at '+mmss(t));break}
    case 'sheetSave':saveSheet();break;
    case 'sheetClose':saveSheet();break;
    case 'eraseSel':{const a=S.marks[curPage]||[],i=a.findIndex(x=>x.id===selId);if(i>=0){undoStack.push({op:'erase',p:curPage,m:a[i]});a.splice(i,1);if(!a.length)delete S.marks[curPage];save();toast('Erased. Numbers updated.')}selId=null;drawMarks();refreshMarkCard();refreshTools();break}
    case 'cancelSel':selId=null;drawMarks();refreshTools();break;
    case 'notesToggle':showNotes=!showNotes;render();break;
    case 'undoMark':{const u=undoStack.pop();if(!u)break;if(u.op==='add'){const a=S.marks[u.p]||[],i=a.findIndex(x=>x.id===u.id);if(i>=0)a.splice(i,1)}else{(S.marks[u.p]||(S.marks[u.p]=[])).push(u.m)}
      save();closeSheet();drawMarks();refreshMarkCard();toast('Undone');break}
    case 'goMistakes':go('mistakes');break;
    case 'goIndex':go('index');break;
    case 'qLink':$('#qIn').click();break;
    case 'qAll':qPrepareAll();break;
    case 'qStop':if(qRun){qRun.stop=true;toast('Stopping after this surah…')}break;
    case 'qCheck':{const v=+(($('#qChk')||{}).value);if(v)openQariReview(v);break}
    case 'qUnlink':{if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again to remove all linked surahs';break}
      for(const k of Object.keys(qState().files)){await idel('audio:'+QK(+k));await idel('qenergy:'+k)}S.qari={name:S.qari.name,files:{},times:{}};
      if(String(player.key||'').startsWith('qari-')){au.pause();au.removeAttribute('src');player={id:null}}save();toast('Removed. Your phone folder is untouched.');render();renderDock();break}
    case 'ixPlayA':{const v=+(($('#ixA')||{}).value)||1;qPlayAyah(+b.dataset.s,Math.min(AY[+b.dataset.s-1],v));break}
    case 'ixFind':ixQ=($('#ixQ')||{}).value||'';ixFind();break;
    case 'ixGoA':{const v=+(($('#ixA')||{}).value)||1;openAyah(+b.dataset.s,v);break}
    case 'ixGoP':{const v=+(($('#ixP')||{}).value)||F();openPage(v);break}
    case 'goHifz':go('settings');setTimeout(()=>{const c=$('#hifzCard');if(c)c.scrollIntoView({block:'start'})},50);break;
    case 'memorize':memorize(curPage);toast('Page '+curPage+' added to your hifz');render();break;
    case 'unmemorize':if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again to remove';break}delete S.mem[curPage];if(curPage<(S.sabaqPtr||F()))S.sabaqPtr=curPage;S.today=null;save();toast('Removed from memorized');render();break;
    case 'recFirst':go('audio');startRec();break;
    case 'recPause':pauseRec();break;
    case 'recStop':stopRec();break;
    case 'goAudio':go('audio');break;
    case 'next':openPage(curPage+1);break;
    case 'prev':openPage(curPage-1);break;
    case 'zoom':zoom=zoom>1?1:1.7;render();break;
    case 'marksToggle':showMarks=!showMarks;render();break;
    case 'undo':{const a=S.marks[curPage]||[],t=ymd();for(let i=a.length-1;i>=0;i--)if(a[i].d===t){a.splice(i,1);break}save();render();break}
    case 'fixAll':(S.marks[curPage]||[]).forEach(m=>{if(!m.fixed)m.fixed=ymd()});save();toast('All marked corrected');drawMarks();refreshMarkCard();break;
    case 'clearMarks':if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again to erase';break}(S.marks[curPage]||[]).forEach(m=>undoStack.push({op:'erase',p:curPage,m}));delete S.marks[curPage];save();drawMarks();refreshMarkCard();break;
    case 'pp':if(au.paused){if(player.b==null&&player.a!=null){player.b=isFinite(au.duration)?au.duration:null}au.play().catch(()=>{})}else au.pause();break;
    case 'back5':au.currentTime=Math.max(0,au.currentTime-5);break;
    case 'setA':player.a=au.currentTime;if(player.b!=null&&player.b<=player.a)player.b=null;renderDock();break;
    case 'setB':if(player.a==null)player.a=0;if(au.currentTime>player.a){player.b=au.currentTime;player.left=S.settings.repeat||1;au.currentTime=player.a;au.play().catch(()=>{})}renderDock();break;
    case 'loop':player.loop=!player.loop;if(player.loop&&player.b==null){player.a=player.a??0;player.b=isFinite(au.duration)?au.duration:null}renderDock();break;
    case 'speed':{const sp=[0.75,1,1.25,1.5],i=(sp.indexOf(S.settings.speed||1)+1)%sp.length;S.settings.speed=sp[i];au.playbackRate=sp[i];save();renderDock();break}
    case 'closeP':au.pause();au.removeAttribute('src');player={id:null};renderDock();if(tab!=='today')render();break;
    case 'saveSet':{const s=S.settings,n=(id,min,max,def)=>{const v=parseInt($(id).value,10);return isNaN(v)?def:Math.min(max,Math.max(min,v))};
      s.sabaqPerDay=n('#s-sab',1,10,1);s.sabaqiPages=n('#s-sqi',1,60,20);s.manzilPerDay=n('#s-man',1,120,20);s.reviewMax=n('#s-rm',0,30,4);s.goal=n('#s-goal',5,300,45);s.remind=$('#s-rem').value||'05:30';s.ramadan=$('#s-ram').value||s.ramadan;
      s.firstPage=n('#s-fp',1,700,2);s.firstPdf=n('#s-pdf',1,2000,5);s.lastPage=n('#s-lp',s.firstPage,1000,611);
      const known=parseRanges($('#s-known').value);for(let q=F();q<=L();q++){if(known.has(q)){if(!S.mem[q])S.mem[q]={d:'known',src:'known'}}else if(S.mem[q]&&S.mem[q].src==='known')delete S.mem[q]}
      S.sabaqPtr=n('#s-sp',s.firstPage,s.lastPage,S.sabaqPtr||s.firstPage);
      urlCache.forEach(u=>URL.revokeObjectURL(u));urlCache.clear();S.today=null;save();toast('Settings saved');render();break}
    case 'persist':if(navigator.storage&&navigator.storage.persist){const ok=await navigator.storage.persist();toast(ok?'Protected. Chrome will not clear app data on its own.':'Chrome declined. Installing the app to the home screen usually allows it.')}break;
    case 'copyB':{const t=$('#s-data');try{await navigator.clipboard.writeText(t.value);toast('Backup copied')}catch(err){t.select();toast('Text selected. Use your phone’s Copy.')}break}
    case 'fileB':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='hifz-backup-'+ymd()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup file saved to Downloads');break}
    case 'restoreB':try{const v=JSON.parse($('#s-data').value);if(!v.settings||!v.pages)throw 0;S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),v);S.settings=Object.assign({},DEFAULTS.settings,v.settings);save();toast('Restored');render()}catch(err){toast('That text is not a valid backup.')}break;
    case 'reset':if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again to clear everything';break}
      for(const r of S.recs){await idel('audio:'+r.id);await idel('energy:'+r.id)}const keep=S.settings,keepQ=S.qari;S=JSON.parse(JSON.stringify(DEFAULTS));S.settings=keep;if(keepQ)S.qari=keepQ;S.pointer=keep.firstPage;S.sabaqPtr=keep.firstPage;save();toast('Cleared');render();break;
  }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(timer.on){S.minutes[ymd()]=(S.minutes[ymd()]||0)+(Date.now()-timer.start)/1000;timer.start=Date.now()}iput('state',S).catch(()=>{})}});

/* ---------- Start ---------- */
(async()=>{
  const st=await iget('state');
  if(st){S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),st);S.settings=Object.assign({},DEFAULTS.settings,st.settings)}
  curPage=(todayPlan().sabaq[0])||S.pointer;
  pdfIdx=await iget('pdfIdx')||null;pdfBlob=pdfIdx?await iget('pdf'):null;if(!pdfBlob)pdfIdx=null;
  go('today');renderDock();
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
<!--APP-END-->

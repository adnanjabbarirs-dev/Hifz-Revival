<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--APP-START-->
<title>Hifz Revival</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone app. Sticky top bar, one view at a time, dock (timer/recorder/player) above a fixed bottom tab bar */
:root{
  /* White and gold: white pages, warm gold accents, dark warm text for reading */
  --bg:#ffffff; --surface:#fffcf3; --ink:#2b2414; --muted:#7a6a48; --line:#ead9a8;
  --accent:#8f6a12; --accent-ink:#ffffff; --gold:#c9a03a;
  --strong:#2e7d4f; --partial:#b7791f; --forgot:#b4423a; --none:#efe6cc; --pen:#d0312d;
  --display:Georgia,"Noto Serif","Times New Roman",serif; --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:620px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:0 170px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line);margin-bottom:14px}
.top h1{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0}
.top p{margin:0;color:var(--muted);font-size:.85rem}
h2{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:0 0 10px;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.note{font-size:.85rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:center;padding:8px 4px;border-radius:10px;background:var(--bg)}
.stat b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 8px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.c-strong{color:var(--strong)} .c-partial{color:var(--partial)} .c-forgotten{color:var(--forgot)} .c-none{color:var(--muted)}
button,.btn,label.btn{font:inherit;font-weight:600;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 13px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;line-height:1.3}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{padding:5px 9px;font-size:.82rem}
button.danger{color:var(--forgot)}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label.f{display:block;font-size:.82rem;color:var(--muted);margin:10px 0 4px}
input,select,textarea{font:inherit;width:100%;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}
textarea{min-height:80px;font-size:.78rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .name{font-weight:600}
.bar{height:9px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rate button{padding:10px 2px;font-size:.9rem}
.r-s{border-color:var(--strong)!important;color:var(--strong)!important}
.r-p{border-color:var(--partial)!important;color:var(--partial)!important}
.r-f{border-color:var(--forgot)!important;color:var(--forgot)!important}
.banner{border-left:4px solid var(--gold);background:var(--surface);padding:9px 12px;border-radius:8px;margin-bottom:12px;font-size:.9rem}
.pagechips{display:flex;flex-wrap:wrap;gap:6px}
.pagechips button{min-width:52px;font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-size:2.6rem;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
/* Mushaf reader */
.rtools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 0px);z-index:4;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 2px;font-size:.85rem}
.pager{display:grid;grid-template-columns:auto auto 1fr auto;gap:6px;align-items:center}
.pinfo{font-size:.8rem;color:var(--muted);text-align:center;margin-top:-2px}
.ixtabs{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.ixtabs button{border:0;border-radius:0;padding:9px 2px}
.ixrow{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-radius:0;border-left:0;border-right:0;border-bottom:0;font-weight:400}
.ixrow:first-child{border-top:0}
.ixnum{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.ixar{font-family:"Noto Naskh Arabic","Scheherazade New","Amiri",serif;font-size:1.2rem;direction:rtl;color:var(--ink);line-height:1.2}
.ixmeta{font-size:.78rem;color:var(--muted)}
.ixpg{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);font-size:.9rem;text-align:right}
.ixpanel{padding:4px 4px 12px 52px;border-top:0}
.rkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:8px}
.rkgrid button{padding:6px 4px;font-size:.78rem;font-weight:600;line-height:1.25}
.rk{display:grid;grid-template-columns:1fr auto;gap:0}
.rk>button:first-child{border-radius:10px 0 0 10px}
.rk>button.rkp{border-radius:0 10px 10px 0;border-left:0;padding:6px 9px;color:var(--accent)}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rgrid{display:grid;grid-template-columns:42px 1fr 72px;gap:8px;align-items:center;margin-top:8px}
.rgrid select,.rgrid input{padding:8px;min-width:0}
.rgrid input{text-align:center;font-variant-numeric:tabular-nums}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.r3 label.f{font-size:.75rem}
.rk3{display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:6px;align-items:center;margin-top:8px}
.rk3 select,.rk3 input{padding:7px;min-width:0}
.qchips button{padding:5px 9px;font-size:.8rem;font-variant-numeric:tabular-nums}
.qprog{height:6px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:6px}
.qprog i{display:block;height:100%;background:var(--gold);width:0}
.rkgrid button small{display:block;font-weight:400;color:var(--muted);font-size:.7rem}
.pggrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.pggrid button{padding:6px 0;font-size:.74rem;font-variant-numeric:tabular-nums;font-weight:600;min-width:0}
.pggrid button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pggrid button.memd{border-color:var(--strong)}
.hlband{position:absolute;left:4%;right:4%;border-radius:6px;background:rgba(244,196,48,.28);box-shadow:0 0 0 2px rgba(214,160,20,.75);pointer-events:none;z-index:3}
@media (prefers-reduced-motion:no-preference){.hlband{animation:hlp 1.4s ease-in-out 3}}
@keyframes hlp{50%{background:rgba(244,196,48,.5)}}
.nowp{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:1.5px solid var(--accent);border-radius:10px;padding:7px 10px;font-size:.92rem}
.nowp b{font-size:1rem}
.nowp .ref{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem}
.nowp[hidden]{display:none}
.flband{position:absolute;left:3%;right:3%;border-radius:6px;background:rgba(212,167,58,.22);box-shadow:0 0 0 2px rgba(143,106,18,.75);pointer-events:none;z-index:3}
@media (prefers-reduced-motion:no-preference){.flband{transition:top .3s ease,height .3s ease}}
.fltag{position:absolute;left:3%;transform:translateY(-100%);background:#8f6a12;color:#fff;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px 6px 0 0;pointer-events:none;z-index:3;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.fltag{transition:top .3s ease}}
.hltag{position:absolute;right:4%;transform:translateY(-100%);background:#a07a22;color:#fff;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px 6px 0 0;pointer-events:none;z-index:3;white-space:nowrap}
.pager input{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;padding:7px}
.scroller{overflow:auto;border-radius:8px;border:1px solid var(--line);background:#fff;touch-action:pan-y pinch-zoom}
.pagebox{position:relative;width:100%;margin:0 auto}
.lsband{position:absolute;left:3%;right:3%;border-radius:6px;background:rgba(46,125,79,.16);box-shadow:0 0 0 2px rgba(46,125,79,.7);pointer-events:none;z-index:6}
.lstag{position:absolute;left:3%;transform:translateY(-100%);background:#2e7d4f;color:#fff;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px 6px 0 0;pointer-events:none;z-index:6;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.lsband,.lstag{transition:top .3s ease}}
.lsw{direction:rtl;text-align:right;font-family:"Noto Naskh Arabic","Amiri","Scheherazade New",serif;font-size:1.25rem;line-height:2.1;margin-top:4px;min-height:2.1em;overflow:hidden;white-space:nowrap;text-overflow:clip}
.lsw span{padding:0 3px;border-radius:5px;margin-left:2px}
.lsw .ok{color:#2e7d4f}.lsw .unsure{background:#fbecc4;color:#7a5710}.lsw .wrong,.lsw .missed{background:#f6d5d2;color:#b4423a}.lsw .missed{text-decoration:line-through}
.lsflag{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.lsflag .ar{font-family:"Noto Naskh Arabic","Amiri",serif;font-size:1.2rem;direction:rtl}
.lsflag.red b{color:var(--forgot)} .lsflag.amber b{color:var(--partial)}
.lvlbar{height:4px;border-radius:2px;background:var(--none);overflow:hidden;margin-top:4px}.lvlbar i{display:block;height:100%;width:0;background:#2e7d4f}
.cover{position:absolute;left:0;right:0;bottom:0;z-index:5;border:0;border-top:3px solid var(--gold);border-radius:0 0 6px 6px;padding:0;
  background:linear-gradient(180deg,#fffaf0,#f6e9c6);color:var(--accent);font:600 .95rem var(--body);display:flex;align-items:flex-start;justify-content:center}
.cover span{margin-top:14px;padding:6px 12px;border-radius:999px;background:#fff;box-shadow:0 1px 4px rgba(143,106,18,.25)}
@media (prefers-reduced-motion:no-preference){.cover{transition:top .25s ease}}
.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.cal i{aspect-ratio:1;border-radius:3px;background:var(--none)}
.cal i.l1{background:#f1dfa6}.cal i.l2{background:#ddb85a}.cal i.l3{background:#b88a24}.cal i.l4{background:#7a5710}.cal i.td{outline:2px solid var(--ink);outline-offset:-1px}
.plan b{color:var(--accent)} .plan .item{padding:8px 0}
.pagebox img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.pagebox canvas{position:absolute;inset:0;width:100%;height:100%}
.pagebox.mark canvas{touch-action:none}
.dot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid #fff;background:var(--accent);color:var(--accent-ink);font-size:.7rem;font-weight:700;padding:0;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.dot.ayah{background:var(--gold);color:#1c1300}
.dot.pending{background:var(--surface);border:2px dashed var(--forgot);color:var(--forgot)}
.landing .hero{text-align:center;padding-block:28px 10px}
.landing .hero img{width:92px;height:92px;display:inline-block;filter:drop-shadow(0 8px 16px rgba(0,0,0,.22))}
.landing h1{font-family:var(--display);font-weight:400;font-size:2rem;margin:12px 0 2px;text-wrap:balance}
.steps{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.tabs2{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:6px}
.tabs2 button{border:0;border-radius:0}
.ayahin{width:56px;padding:5px;text-align:center;display:inline-block}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0}
.chk input{width:auto}
.placeholder{aspect-ratio:749/1125;max-width:100%;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
/* Progress heatmap: one row per 20 pages */
.heat{display:grid;grid-template-columns:34px repeat(20,1fr);gap:2px;font-size:.62rem;color:var(--muted);font-variant-numeric:tabular-nums}
.heat button{aspect-ratio:1;padding:0;border:0;border-radius:2px;background:var(--none);min-width:0;position:relative}
.heat button.strong{background:var(--strong)} .heat button.partial{background:var(--partial)} .heat button.forgotten{background:var(--forgot)}
.heat button.mk::after{content:"";position:absolute;inset:30%;border-radius:50%;background:#fff}
.heat button.ptr{outline:2px solid var(--ink);outline-offset:-1px}
.heat button.mem:not(.strong):not(.partial):not(.forgotten){background:color-mix(in srgb,var(--accent) 45%,var(--none))}
.jz{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.jz button{padding:7px 0;font-size:.85rem;font-variant-numeric:tabular-nums}
.heat span{align-self:center;text-align:right;padding-right:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.chart{display:flex;align-items:flex-end;gap:3px;height:100px}
.chart div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.chart div.goal{background:var(--gold)}
.axis{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted)}
/* Dock and nav */
.dock{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;gap:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:0 6px;pointer-events:none}
.dock>div{pointer-events:auto;max-width:620px;margin:0 auto;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.dock .rec{border-color:var(--forgot)}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--forgot);margin-right:6px}
@media (prefers-reduced-motion:no-preference){.recdot{animation:blink 1.2s infinite}}
@keyframes blink{50%{opacity:.25}}
.tnum{font-variant-numeric:tabular-nums}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:7}
nav button{border:0;border-radius:0;background:none;padding:8px 0 9px;font-size:.6rem;letter-spacing:-.01em;color:var(--muted);font-weight:600}
nav button svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav button[aria-current="true"]{color:var(--accent);background:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 96px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:.9rem;z-index:20;max-width:90vw;text-align:center}
.reclist .item{align-items:flex-start}
.mk-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;margin-top:8px}
.mk-list .m{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center}
.mk-list input{padding:5px 7px;font-size:.85rem}
.hide{display:none!important}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--forgot);border-radius:10px;padding:6px 10px}
.swrap{position:relative;display:grid;grid-template-columns:27% 1fr;background:#fff}
.swrap.nonotes{grid-template-columns:1fr}
.swrap.nonotes .margin{display:none}
.margin{position:relative;border-right:1px dashed #d6d1c2;background:#fff}
.mnote{position:absolute;left:4px;right:6px;background:#fff;color:#1c1c1c;border:1.5px solid #d0312d;border-radius:6px;padding:2px 4px 3px;font:500 10.5px/1.25 system-ui,sans-serif;text-align:left;cursor:pointer;overflow:hidden;max-height:4.4em}
.mnote b{display:inline-block;min-width:16px;height:16px;border-radius:8px;background:#d0312d;color:#fff;text-align:center;font-size:10px;line-height:16px;margin-right:3px;padding:0 3px}
.mnote.hl{border-color:#b08a10}.mnote.hl b{background:#b08a10}
.mnote.fx{border-color:#9aa3a6;color:#777}.mnote.fx b{background:#9aa3a6}
.mnote.sel{box-shadow:0 0 0 3px rgba(208,49,45,.45)}
.mnote .e{color:#999;font-style:italic}
.leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.tools button{padding:7px 2px;font-size:.82rem}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:620px;margin:0 auto}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:14}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{padding:5px 10px;font-size:.82rem;border-radius:99px}
.mk{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.mk:first-child{border-top:0}
.mk .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;color:#fff;background:var(--pen)}
.mk .num.hl{background:var(--gold);color:#1c1300}
.mk .num.fx{background:var(--muted)}
.mk .txt{min-width:0}
.mk .cm{white-space:pre-wrap;word-break:break-word}
.mk.done .cm{color:var(--muted)}
.filt{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.filt button{border:0;border-radius:0;padding:8px 2px;font-size:.85rem}
.wave{width:100%;height:84px;display:block;border-radius:8px;background:var(--bg);touch-action:manipulation}
.seglist{display:flex;flex-direction:column}
.segrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.segrow.cur{background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:8px}
.segrow.drop .name{text-decoration:line-through;color:var(--muted)}
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--surface);padding-block:8px;border-bottom:1px solid var(--line)}
.lvl{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:6px}
.lvl i{display:block;height:100%;background:var(--forgot);width:0}
</style>
</head>

/* ---------- PDF page extractor: reads JPEG page scans straight out of the user's own PDF ---------- */
async function indexPdfPages(blob, onProgress){
  // One forward pass over the file: no jumping around, so it is fast even on files picked from Android storage.
  const reader=blob.stream().getReader(),dec=new TextDecoder('latin1'),out=[];
  let buf='',base=0,read=0,state='find',cur=null,from=0,lastP=-1;
  for(;;){
    const {done,value}=await reader.read();
    if(value){buf+=dec.decode(value,{stream:true});read+=value.length}
    let again=true;
    while(again){again=false;
      if(state==='find'){const i=buf.indexOf('DCTDecode',from);
        if(i!==-1){const o=buf.lastIndexOf(' obj',i),head=o>0?buf.slice(Math.max(0,o-12),o):'',n=parseInt((head.match(/(\d+)\s+0$/)||[])[1],10);
          cur={num:isNaN(n)?out.length:n};state='stream';from=i+9;again=true}
        else from=Math.max(from,buf.length-16)}
      else if(state==='stream'){const k=buf.indexOf('stream',from);
        if(k!==-1&&k+10<=buf.length){let d=k+6;if(buf[d]==='\r')d++;if(buf[d]==='\n')d++;
          if(buf.charCodeAt(d)===0xff&&buf.charCodeAt(d+1)===0xd8){cur.start=base+d;state='end';from=d+2}else{state='find';from=d}again=true}
        else if(k===-1)from=Math.max(from,buf.length-8)}
      else{const e=buf.indexOf('endstream',from);
        if(e!==-1){const t0=Math.max(0,cur.start-base,e-16),ff=buf.slice(t0,e).lastIndexOf('\xff\xd9');
          cur.end=ff===-1?base+e:base+t0+ff+2;out.push(cur);cur=null;state='find';from=e+9;again=true}
        else from=Math.max(from,buf.length-16)}
    }
    const cut=Math.min(from,Math.max(0,buf.length-4096));
    if(cut>0){buf=buf.slice(cut);base+=cut;from-=cut}
    const pr=Math.floor(read/blob.size*100);if(pr!==lastP){lastP=pr;onProgress&&onProgress(read/blob.size)}
    if(done)break;
  }
  out.sort((x,y)=>x.num-y.num);
  return out.map(f=>[f.start,f.end]);
}

/* ---------- Local storage (IndexedDB) ---------- */
let dbp=null;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{const r=indexedDB.open('hifz-revival',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbp}
async function iget(k){try{const d=await db();return await new Promise((res,rej)=>{const r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return undefined}}
async function iput(k,v){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function idel(k){try{const d=await db();await new Promise(res=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=res})}catch(e){}}

function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function nice(s){return new Date(s+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'})}
function mmss(sec){sec=Math.max(0,Math.floor(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')}

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2200)}

/* ---------- State ---------- */
const DEFAULTS={settings:{mkNum:'page',sabaqPerDay:1,sabaqiPages:20,manzilPerDay:20,pagesPerDay:6,reviewMax:4,goal:45,remind:'05:30',ramadan:'2027-02-08',firstPdf:5,firstPage:2,lastPage:611,repeat:1,speed:1},
  pointer:2,cycle:1,mem:{},sabaqPtr:2,manzilPtr:0,knownText:'',pages:{},marks:{},minutes:{},recs:[],today:null};
let S=JSON.parse(JSON.stringify(DEFAULTS));
let pdfBlob=null,pdfIdx=null,saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>iput('state',S).catch(()=>toast('Could not save. Phone storage may be full.')),250)}
const F=()=>S.settings.firstPage, L=()=>S.settings.lastPage;
const nextP=p=>p>=L()?F():p+1;

/* ---------- Sabaq, Sabaqi, Manzil ---------- */
const memPages=()=>Object.keys(S.mem).map(Number).sort((a,b)=>a-b);
function nextUnmem(p){for(let q=Math.max(F(),p);q<=L();q++)if(!S.mem[q])return q;return null}
function sabaqiList(){const t=ymd();
  return Object.keys(S.mem).map(Number).filter(p=>S.mem[p].src==='sabaq'&&S.mem[p].d<t)
    .sort((a,b)=>S.mem[b].d.localeCompare(S.mem[a].d)||b-a).slice(0,S.settings.sabaqiPages).sort((a,b)=>a-b)}
function todayPlan(){
  const t=ymd();
  if(!S.today||S.today.date!==t||!S.today.v2){
    const sab=[];let p=nextUnmem(S.sabaqPtr||F());for(let i=0;i<S.settings.sabaqPerDay&&p!=null;i++){sab.push(p);p=nextUnmem(p+1)}
    const sq=sabaqiList(),pool=memPages().filter(x=>!sq.includes(x)&&!sab.includes(x)),man=[];
    if(pool.length){let i=pool.findIndex(x=>x>=(S.manzilPtr||0));if(i<0)i=0;for(let k=0;k<Math.min(S.settings.manzilPerDay,pool.length);k++)man.push(pool[(i+k)%pool.length])}
    S.today={date:t,v2:1,sabaq:sab,sabaqi:sq,manzil:man,batch:sab};save();
  }
  return S.today;
}
function stageOf(p){const P=todayPlan();return P.sabaq.includes(p)?'sabaq':P.sabaqi.includes(p)?'sabaqi':P.manzil.includes(p)?'manzil':S.mem[p]?'memorized':'new'}
const STAGE={sabaq:'Sabaq today',sabaqi:'Sabaqi today',manzil:'Manzil today',memorized:'Memorized',new:'Not memorized yet'};
function memorize(p){S.mem[p]={d:ymd(),src:'sabaq'};if(p>=(S.sabaqPtr||F())){S.sabaqPtr=nextUnmem(p+1)||p}save()}
function parseRanges(txt){const out=new Set();for(const part of String(txt||'').split(/[,\s]+/)){const m=part.match(/^(\d+)(?:-(\d+))?$/);if(!m)continue;
  let a=+m[1],b=m[2]?+m[2]:a;if(a>b)[a,b]=[b,a];for(let q=Math.max(F(),a);q<=Math.min(L(),b);q++)out.add(q)}return out}
function toRanges(arr){const r=[];let a=null,b=null;for(const q of arr){if(a===null){a=b=q}else if(q===b+1)b=q;else{r.push(a===b?a:a+'-'+b);a=b=q}}if(a!==null)r.push(a===b?a:a+'-'+b);return r.join(', ')}
/* Juz start pages in this 15-line mushaf (read from its page headers) */
const JUZ=[2];for(let k=2;k<=29;k++)JUZ.push(23+20*(k-2));JUZ.push(587);
function juzOf(p){let j=1;for(let k=0;k<30;k++)if(p>=JUZ[k])j=k+1;return j}
function markKey(m){let y=1,x=0;for(const q of m.pts){if(q[1]<y)y=q[1]}for(const q of m.pts)x=Math.max(x,q[0]);return [y,x]}
function sortedMarks(p){return (S.marks[p]||[]).slice().sort((a,b)=>{const A=markKey(a),B=markKey(b);return Math.abs(A[0]-B[0])>.012?A[0]-B[0]:B[1]-A[1]})}
function numbering(){const map={},byJ=S.settings.mkNum==='juz',cnt={};
  Object.keys(S.marks).map(Number).sort((a,b)=>a-b).forEach(p=>{const j=juzOf(p);let k=0;sortedMarks(p).forEach(m=>{const n=byJ?(cnt[j]=(cnt[j]||0)+1):++k;map[m.id]={n,j,p}})});return map}
function mkLabel(info){return S.settings.mkNum==='juz'?'Juz '+info.j+' · #'+info.n:'Page '+info.p+' · #'+info.n}
function openMarks(p){return (S.marks[p]||[]).filter(m=>!m.fixed)}
function reviewsDue(){
  const t=ymd(),P=todayPlan(),batch=[...P.sabaq,...P.sabaqi,...P.manzil],out=[];
  for(const k in S.pages){const p=+k,x=S.pages[k];if(batch.includes(p))continue;
    if(x.next&&x.next<=t)out.push(p)}
  for(const k in S.marks){const p=+k;if(!out.includes(p)&&!batch.includes(p)&&openMarks(p).length&&!(S.pages[p]&&S.pages[p].next>t))out.push(p)}
  const ord={forgotten:0,partial:1,strong:2};
  return out.sort((a,b)=>(ord[(S.pages[a]||{}).cat]??1)-(ord[(S.pages[b]||{}).cat]??1)||a-b).slice(0,S.settings.reviewMax);
}
function ratePage(p,cat){
  const t=ymd(),x=S.pages[p]||(S.pages[p]={hist:[]});
  /* Spaced repetition: the gap grows each time a page is smooth, shrinks on slips, resets when lost */
  const prev=x.ivl||0;let e=x.ease||2.3;
  if(cat==='strong'){x.ivl=prev?Math.min(60,Math.round(Math.max(prev+1,prev*e))):7;e=Math.min(2.8,e+.1)}
  else if(cat==='partial'){x.ivl=Math.max(2,Math.round((prev||6)*.5));e=Math.max(1.3,e-.15)}
  else{x.ivl=1;e=Math.max(1.3,e-.3)}
  x.ease=+e.toFixed(2);x.cat=cat;x.last=t;x.next=addDays(t,x.ivl);x.hist.push({d:t,r:cat});
  const P=todayPlan(),i=P.manzil.indexOf(p);
  if(i>=0&&i>=(P.manDone??-1)){P.manDone=i;S.manzilPtr=p+1}
  save();
}
function doneToday(){const t=ymd();return Object.keys(S.pages).filter(k=>S.pages[k].last===t).length}

/* ---------- Study timer ---------- */
let timer={on:false,start:0};
function liveSecs(){return (S.minutes[ymd()]||0)+(timer.on?(Date.now()-timer.start)/1000:0)+(rec.on&&!rec.paused?(Date.now()-rec.seg)/1000:0)}
function toggleTimer(){if(timer.on){S.minutes[ymd()]=(S.minutes[ymd()]||0)+(Date.now()-timer.start)/1000;timer.on=false;save()}else{timer.on=true;timer.start=Date.now()}renderDock();if(tab==='today')render()}

/* ---------- Page images ---------- */
const urlCache=new Map();
async function pageURL(p){
  if(!pdfBlob||!pdfIdx)return null;
  const i=S.settings.firstPdf-1+(p-F());if(i<0||i>=pdfIdx.length)return null;
  if(urlCache.has(i))return urlCache.get(i);
  const [a,b]=pdfIdx[i],u=URL.createObjectURL(new Blob([pdfBlob.slice(a,b)],{type:'image/jpeg'}));
  urlCache.set(i,u);if(urlCache.size>12){const k=urlCache.keys().next().value;URL.revokeObjectURL(urlCache.get(k));urlCache.delete(k)}
  return u;
}
async function loadPdf(file){
  const box=()=>$('#pdfStatus');const say=m=>{const b=box();if(b)b.textContent=m};
  const btns=document.querySelectorAll('[data-act=pickPdf]');btns.forEach(b=>b.disabled=true);
  try{
    // Step 1: keep a copy inside the app (one straight read of the file)
    say('Step 1 of 2: copying your mushaf into the app ('+Math.round(file.size/1048576)+' MB). Keep this screen open…');
    let src=file;
    try{try{navigator.storage&&navigator.storage.persist&&await navigator.storage.persist()}catch(e){}
      await iput('pdf',file);src=await iget('pdf')||file}
    catch(e){src=file;say('Could not keep a copy inside the app ('+(e&&e.name||'storage')+'). Continuing for this session only…')}
    // Step 2: find the page images
    const idx=await indexPdfPages(src,f=>say('Step 2 of 2: finding pages… '+Math.round(f*100)+'%'));
    if(idx.length<20){say('This PDF does not look like a scanned mushaf. No page images were found.');await idel('pdf');return}
    try{await iput('pdfIdx',idx)}catch(e){}
    pdfBlob=src;pdfIdx=idx;urlCache.forEach(u=>URL.revokeObjectURL(u));urlCache.clear();
    toast(idx.length+' page images found');render();
  }catch(e){say('Could not read this PDF ('+(e&&(e.message||e.name)||'error')+'). Try choosing it again.')}
  finally{btns.forEach(b=>b.disabled=false)}
}

const extFor=m=>(m||'').includes('mp4')?'m4a':(m||'').includes('ogg')?'ogg':(m||'').includes('mpeg')?'mp3':(m||'').includes('wav')?'wav':'webm';
const safeName=t=>String(t).replace(/[^\w\- .()]+/g,'_').slice(0,60);
let tx=null,imp=null;
async function buildTransfer(withPdf){
  const say=m=>{const b=$('#txStatus');if(b)b.textContent=m};
  say('Collecting recordings…');
  const files=[],audio={},energy={};
  for(const r of S.recs){if(r.src)continue;
    if(r.auto){const e=await iget('energy:'+r.id);if(e){const en='hifz-revival/energy/'+r.id+'.f32';energy[r.id]=en;files.push({name:en,blob:new Blob([e])})}}
    const b=await iget('audio:'+r.id);if(!b)continue;const nm='hifz-revival/recordings/'+r.date+' '+safeName(r.title)+'__'+r.id+'.'+extFor(r.mime);audio[r.id]=nm;files.push({name:nm,blob:b})}
  if(withPdf&&pdfBlob)files.push({name:'hifz-revival/mushaf.pdf',blob:pdfBlob});
  files.unshift({name:'hifz-revival/progress.json',blob:new Blob([JSON.stringify({app:'hifz-revival',format:1,exported:new Date().toISOString(),state:S,audio,energy,pdfIdx:withPdf&&pdfBlob?pdfIdx:null})],{type:'application/json'})});
  const zip=await makeZip(files,f=>say('Packing… '+Math.round(f*100)+'%'));
  tx={blob:zip,name:'hifz-revival-transfer-'+ymd()+'.zip',recs:Object.keys(audio).length,pdf:withPdf&&!!pdfBlob};
  render();
}
async function openTransfer(file){
  const say=m=>{const b=$('#impStatus');if(b)b.textContent=m};
  try{
    say('Reading transfer file…');
    if(/\.json$/i.test(file.name)||file.type==='application/json'){const v=JSON.parse(await file.text());const st=v.state||v;if(!st.settings||!st.pages)throw new Error('This file is not a Hifz Revival backup.');imp={state:st,files:{},audio:{},pdfIdx:null,name:file.name};}
    else{const files=await readZip(file),pj=files['hifz-revival/progress.json'];if(!pj)throw new Error('This ZIP is not a Hifz Revival transfer file.');
      if(Object.values(files).some(f=>f.method!==0))throw new Error('This ZIP was changed by another app. Send the original file again.');
      const v=JSON.parse(await pj.blob.text());imp={state:v.state,files,audio:v.audio||{},energy:v.energy||{},pdfIdx:v.pdfIdx,name:file.name};}
    render();
  }catch(e){say(e.message||'Could not read that file.')}

async function applyTransfer(){
  const say=m=>{const b=$('#impStatus');if(b)b.textContent=m};
  const st=imp.state;let n=0;
  try{
    for(const r of S.recs)if(!st.recs.some(x=>x.id===r.id))await idel('audio:'+r.id);
    for(const r of st.recs){const f=imp.files[imp.audio[r.id]];if(f){say('Copying recordings… '+(++n)+' of '+st.recs.length);await iput('audio:'+r.id,new Blob([f.blob],{type:r.mime||'audio/webm'}))}}
    for(const id in (imp.energy||{})){const f=imp.files[imp.energy[id]];if(f)await iput('energy:'+id,new Float32Array(await f.blob.arrayBuffer()))}
    st.recs=st.recs.filter(r=>r.src||imp.audio[r.id]&&imp.files[imp.audio[r.id]]||!Object.keys(imp.files).length);
    st.recs=st.recs.filter(r=>!r.src||st.recs.some(x=>x.id===r.src));
    const pf=imp.files['hifz-revival/mushaf.pdf'];
    if(pf){say('Copying the mushaf…');const pb=new Blob([pf.blob],{type:'application/pdf'});const idx=imp.pdfIdx||await indexPdfPages(pb);await iput('pdf',pb);await iput('pdfIdx',idx);pdfBlob=await iget('pdf')||pb;pdfIdx=idx;urlCache.forEach(u=>URL.revokeObjectURL(u));urlCache.clear()}
    const myQ=S.qari;S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),st);S.settings=Object.assign({},DEFAULTS.settings,st.settings);S.today=null;
    if(S.qari){S.qari.prev=S.qari.files;S.qari.files={}}if(myQ&&Object.keys(myQ.files||{}).length)S.qari=myQ;
    await iput('state',S);imp=null;curPage=(todayPlan().sabaq[0])||F();player={id:null};au.removeAttribute('src');
    toast('Transfer complete');go('today');renderDock();
  }catch(e){say('Stopped: '+(e.message||e.name||'storage error')+'. Free some space and try again.')}
}

function vLanding(){
  $('#view').innerHTML=`<div class="landing"><div class="hero">${ICON}<h1>Hifz Revival</h1><p class="note" style="margin:0">Ramadan 2027 · page-by-page revision of your own mushaf</p></div>
  <section class="card"><ol class="steps">
   <li><div><b>Load your mushaf PDF</b><div class="note">Your own 15-line copy. Pages are read straight from it, so every page is your verified print.</div></div></li>
   <li><div><b>Recite, record, mark</b><div class="note">Record a whole surah and let the app split it into ayat. Mark each mistake on the exact word with a dated note.</div></div></li>
   <li><div><b>Sabaq, sabaqi, manzil</b><div class="note">A new lesson, your recent pages and your old revision every day, with weak pages brought back until Ramadan.</div></div></li></ol>
   <button class="primary" data-act="pickPdf" style="width:100%;margin-top:16px">Choose mushaf PDF</button>
   <p class="note" id="pdfStatus" aria-live="polite" style="margin:6px 0 0"></p>
   <button data-act="pickZip" style="width:100%;margin-top:8px">Moving from another phone? Import transfer file</button>
   ${transferBlocks()}</section>
  <p class="note" style="text-align:center">Everything stays on this phone and works offline.</p></div>`;
}
function vToday(){
  if(!pdfIdx){vLanding();return}
  const P=todayPlan(),rev=reviewsDue(),secs=liveSecs(),g=S.settings.goal*60;
  const t=ymd(),recToday=S.recs.filter(r=>r.date===t),mc=Object.keys(S.mem).length,total=L()-F()+1;
  const days=Math.max(0,dayDiff(t,S.settings.ramadan)),by=Math.min(total,mc+days*S.settings.sabaqPerDay);
  const [h,mi]=S.settings.remind.split(':').map(Number),now=new Date(),late=now.getHours()*60+now.getMinutes()>=h*60+mi&&secs<60&&!recToday.length;
  const chip=(p,sab)=>{const x=S.pages[p],done=sab?(S.mem[p]&&S.mem[p].d===t):(x&&x.last===t),o=openMarks(p).length;
    return `<button class="small ${x?'r-'+x.cat[0]:''}" data-page="${p}" style="${done?'':'border-style:dashed'}">${done?'✓ ':''}${p}${o?' ✎'+o:''}</button>`};
  const cnt=(arr,sab)=>arr.filter(p=>sab?(S.mem[p]&&S.mem[p].d===t):(S.pages[p]&&S.pages[p].last===t)).length;
  const fresh=!mc&&!Object.keys(S.pages).length;
  $('#view').innerHTML=`
  <div class="nowp" data-now hidden style="margin-bottom:12px">▶ Now playing: <b></b><span class="ref"></span></div>
  ${(()=>{const st=streaks(actMap());return st.cur>1?`<p class="note" style="margin:0 0 10px">🔥 ${st.cur}-day revision streak${st.best>st.cur?' · best '+st.best:''}</p>`:''})()}
  ${late?`<div class="banner">It is past your ${S.settings.remind} reminder time and nothing is logged yet today.</div>`:''}
  ${fresh?`<section class="card" style="border-color:var(--gold)"><h2>Set up your hifz</h2><p style="margin-top:0">Tell the app which pages you already know, so they go into your manzil, and where your new sabaq starts.</p><button class="primary" data-act="goHifz" style="width:100%">Set up my hifz</button></section>`:''}
  <section class="card"><div class="row"><h2 class="grow" style="margin:0">Sabaq <span class="note">· new lesson</span></h2><span class="note tnum">${cnt(P.sabaq,1)}/${P.sabaq.length}</span></div>
   ${P.sabaq.length?`<div class="pagechips" style="margin-top:10px">${P.sabaq.map(p=>chip(p,1)).join('')}</div>
   <p class="note" style="margin:8px 0 0">Memorize, recite it to yourself or a teacher, then tap ✓ Memorized on the page.</p>
   <div class="row" style="margin-top:10px">${recToday.length?`<button class="grow" data-act="goAudio">${recToday.length} recording${recToday.length>1?'s':''} today</button>`:`<button class="grow" data-act="recFirst">● Record</button>`}
   <button class="primary grow" data-page="${P.sabaq[0]}">Open page ${P.sabaq[0]}</button></div>`
   :'<p class="note" style="margin:8px 0 0">Every page is memorized. Your days are now sabaqi and manzil.</p>'}</section>
  <section class="card"><div class="row"><h2 class="grow" style="margin:0">Sabaqi <span class="note">· recent ${S.settings.sabaqiPages} pages</span></h2><span class="note tnum">${cnt(P.sabaqi)}/${P.sabaqi.length}</span></div>
   ${P.sabaqi.length?`<div class="pagechips" style="margin-top:10px">${P.sabaqi.map(p=>chip(p)).join('')}</div><p class="note" style="margin:8px 0 0">Recite all of these every day, then rate each page.</p>`
   :`<p class="note" style="margin:8px 0 0">Pages you memorize as sabaq collect here and are recited daily until they move on to manzil.</p>`}</section>
  <section class="card"><div class="row"><h2 class="grow" style="margin:0">Manzil <span class="note">· old revision</span></h2><span class="note tnum">${cnt(P.manzil)}/${P.manzil.length}</span></div>
   ${P.manzil.length?`<p class="note" style="margin:6px 0 0">Pages ${toRanges(P.manzil.slice().sort((a,b)=>a-b))}</p><div class="pagechips" style="margin-top:8px">${P.manzil.map(p=>chip(p)).join('')}</div>`
   :`<p class="note" style="margin:8px 0 0">No older pages yet. ${mc?'Pages leave sabaqi after the most recent '+S.settings.sabaqiPages+'.':'Add the pages you already know in Settings.'}</p>`}</section>
  ${rev.length?`<section class="card"><h2>Also due: weak pages</h2><div class="pagechips">${rev.map(p=>chip(p)).join('')}</div><p class="note" style="margin:8px 0 0">Pages rated “Some slips” or “Lost it”, or with open mistakes.</p></section>`:''}
  <section class="card"><h2>Study time</h2>
   <div class="row"><div class="grow"><b class="tnum" id="todayT">${mmss(secs)}</b> of ${S.settings.goal} min</div><button class="${timer.on?'':'primary'}" data-act="timer">${timer.on?'Pause timer':'Start timer'}</button></div>
   <div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,secs/g*100)}%"></i></div>
   <p class="note" style="margin:6px 0 0">Recording time counts automatically.</p></section>
  <section class="card"><h2>Road to Ramadan</h2>
   <div class="stats"><div class="stat"><b>${mc}</b><span>Memorized</span></div><div class="stat"><b>${S.settings.sabaqPerDay}</b><span>Sabaq / day</span></div><div class="stat"><b>${by}</b><span>By Ramadan</span></div></div>
   <div class="bar" style="margin-top:10px"><i style="width:${mc/total*100}%"></i></div>
   <p class="note" style="margin:6px 0 0">${mc} of ${total} pages. At ${S.settings.sabaqPerDay} page${S.settings.sabaqPerDay>1?'s':''} a day of sabaq you will know about ${by} pages when Ramadan begins.</p></section>`;
}

let pbox=null;
function pageAudioHTML(p){
  const sess=S.recs.filter(r=>r.kind!=='ayah'&&r.markers.some(m=>m.page===p)),clips=ayahClips(p);
  let h='<h2>Audio for this page</h2>';
  if(clips.length)h+=`<div class="row" style="margin-bottom:4px"><b class="grow">${clips.length} ayah clip${clips.length>1?'s':''}</b><button class="small primary" data-playall="${p}">▶ Play all in order</button></div>`+
    clips.map(c=>`<div class="item"><div class="grow"><div class="name">${esc(c.title)}</div><div class="note">${nice(c.date)} · ${mmss(c.dur)}${c.markers[0].x==null?' · no dot yet':''}</div></div>${c.markers[0].x==null?`<button class="small" data-place="${c.id}" aria-label="Place a dot for ${esc(c.title)}">📍</button>`:''}<button class="small primary" data-clip="${c.id}" aria-label="Play ${esc(c.title)}">▶</button></div>`).join('');
  if(sess.length)h+=sess.map(r=>{const i=r.markers.findIndex(m=>m.page===p);const n=r.markers.filter(m=>m.page===p).length;return `<div class="item"><div class="grow"><div class="name">${esc(r.title)}</div><div class="note">Full session · ${nice(r.date)} · ${n} tag${n>1?'s':''} here</div></div><button class="small primary" data-play="${r.id}" data-i="${i}">▶ From here</button></div>`}).join('');
  if(!clips.length&&!sess.length)h+='<p class="note" style="margin:0">Nothing recorded on this page yet. Choose ● Ayah above to record ayah by ayah.</p>';
  return h;
}
function updatePageAudio(){const c=$('#pageAudio');if(c)c.innerHTML=pageAudioHTML(curPage)}

function drawDots(){
  const box=$('#pbox');if(!box)return;box.querySelectorAll('.dot').forEach(d=>d.remove());
  if(mode==='mark')return;
  const add=(x,y,txt,cls,label,fn)=>{const b=document.createElement('button');b.className='dot '+cls;b.style.left=x*100+'%';b.style.top=y*100+'%';b.textContent=txt;b.setAttribute('aria-label',label);b.onclick=e=>{e.stopPropagation();fn()};box.appendChild(b)};
  const sess=r=>r&&r.kind!=='ayah'&&r.markers.some(m=>m.page===curPage&&m.x!=null);
  const r=rec.on&&rec.draft&&sess(rec.draft)?rec.draft:sess(curRec())?curRec():S.recs.find(sess);
  if(r)r.markers.forEach((m,i)=>{if(m.page===curPage&&m.x!=null)add(m.x,m.y,i,'','Play from '+mmss(m.t),()=>{if(rec.on&&r===rec.draft){toast('Tag saved. You can play it after you stop recording.');return}playMarker(r.id,i)})});
  ayahClips(curPage).forEach(c=>{const m=c.markers[0];if(m.x!=null)add(m.x,m.y,c.ayah||'•','ayah','Play '+c.title,()=>playClips([c.id]))});
  if(ar.recording&&ar.clip&&ar.clip.page===curPage&&ar.clip.markers[0].x!=null){const m=ar.clip.markers[0];add(m.x,m.y,ar.clip.ayah,'pending','Recording this ayah',()=>{})}
  if(ar.pos&&ar.pos.page===curPage&&mode==='ayah')add(ar.pos.x,ar.pos.y,ar.ayah,'pending','Next ayah start',()=>{});
}
function bindCanvas(){
  const c=$('#pcv');if(!c)return;let cur=null,down=null,erasing=false;
  const pt=e=>{const r=c.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};
  const erase=q=>{const m=hitMark(q,.022);if(m){const a=S.marks[curPage];a.splice(a.indexOf(m),1);undoStack.push({op:'erase',p:curPage,m});save();drawMarks();refreshMarkCard()}};
  c.addEventListener('pointerdown',e=>{
    if(mode==='mark'&&!placing){c.setPointerCapture(e.pointerId);e.preventDefault();
      if(tool==='erase'){down=pt(e)}else cur={id:uid(),d:ymd(),type:tool,note:'',pts:[pt(e)]}}
    else down=pt(e)});
  c.addEventListener('pointermove',e=>{if(cur){cur.pts.push(pt(e));drawMarks(cur)}});
  c.addEventListener('pointerup',e=>{
    if(erasing){erasing=false;return}
    if(cur){const m=cur;cur=null;m.pts=m.pts.filter((q,i)=>i===0||Math.abs(q[0]-m.pts[i-1][0])+Math.abs(q[1]-m.pts[i-1][1])>.002).map(q=>[+q[0].toFixed(4),+q[1].toFixed(4)]);
      (S.marks[curPage]||(S.marks[curPage]=[])).push(m);undoStack.push({op:'add',p:curPage,id:m.id});save();drawMarks();refreshMarkCard();
      if(m.type==='pen')openSheet(curPage,m.id,true);return}
    if(!down)return;const q=pt(e),tap=Math.abs(q[0]-down[0])+Math.abs(q[1]-down[1])<.03;down=null;if(!tap)return;
    if(placing){const r=S.recs.find(x=>x.id===placing);if(r){r.markers[0].x=+q[0].toFixed(4);r.markers[0].y=+q[1].toFixed(4);r.page=curPage;r.markers[0].page=curPage;save();toast('Placed '+r.title)}placing=null;drawDots();updatePageAudio();render();return}
    if(mode==='ayah'){ar.pos={page:curPage,x:+q[0].toFixed(4),y:+q[1].toFixed(4)};if(ar.recording)stopAyah(true);else{drawDots();renderDock()}return}
    if(mode==='tag'){if(tagNow(curPage,q[0],q[1])){drawDots();if(!rec.on)render()}return}
    if(mode==='mark'&&tool==='erase'){const m=hitMark(q,.035);selId=m?m.id:null;if(!m)toast('No mistake there. Tap directly on a mark or its note.');drawMarks();refreshTools();return}
    if(mode==='read'){const m=showMarks&&hitMark(q,.03);if(m)openSheet(curPage,m.id,false)}
  });
  c.addEventListener('pointercancel',()=>{cur=null;erasing=false;drawMarks()});
}

async function openReview(id){
  const r=S.recs.find(x=>x.id===id);if(!r||!r.auto){toast('This recording cannot be auto-split.');return}
  const E=await iget('energy:'+id);if(!E){toast('The pause data for this recording is missing.');return}

    minPause:S.settings.minPause||.8,thr:S.settings.thr||.3,dropped:new Set(),cols:null};
  detect();await loadRec(id);au.pause();tab='audio';go('audio');
}
function detect(count){if(review.kind==='qari'){const r=qAlign(review.surah,review.E,review.fr,review.thr,review.intro);if(r){review.cuts=r.cuts;review.start=r.start;review.end=r.end}review.dropped=new Set();return}
  const res=segmentEnergy(review.E,review.fr,{minPause:review.minPause,thr:review.thr,count});review.cuts=res.cuts;review.start=res.start;review.end=res.end;review.dropped=new Set()}
function segs(){
  const c=review.cuts.slice().sort((x,y)=>x.a-y.a),out=[];let t0=review.start;
  for(const k of c){out.push([t0,k.a]);t0=k.b}out.push([t0,review.end]);
  const dur=review.E.length*review.fr;let k=0;const names=review.kind==='qari'?qIntroNames(review.surah,review.intro):(INTRO[review.intro]||[]);
  return out.map(([a,b])=>{const s={t0:Math.max(0,a-.12),t1:Math.min(dur,b+.22),key:Math.round(a*10)};
    if(review.dropped.has(s.key)){s.drop=true;s.label='Removed'}else if(k<names.length){s.label=names[k];s.ayah=0;k++}else{s.ayah=review.startAyah+k-names.length;s.label='Ayah '+s.ayah;k++}
    return s});
}

   <div class="seglist">${list.map((s,i)=>`<div class="segrow ${s.drop?'drop':''}" data-i="${i}"><div><div class="name">${esc(s.label)}</div><div class="note tnum">${mmss(s.t0)}–${mmss(s.t1)} · ${(s.t1-s.t0).toFixed(1)} s</div></div>
     <div class="row"><button class="small primary" data-seg="${i}" aria-label="Play ${esc(s.label)}">▶</button>${i<list.length-1?`<button class="small" data-join="${i}" aria-label="Join with next">Join ↓</button>`:''}${qr?'':`<button class="small ${s.drop?'':'danger'}" data-drop="${i}">${s.drop?'Restore':'Remove'}</button>`}</div></div>`).join('')}</div></section>
  <button class="primary" data-act="revSave" style="width:100%;margin-bottom:12px">${qr?'Save timings':'Save '+list.filter(s=>!s.drop).length+' clips'}</button>`;

  rd('#rvI',()=>{review.intro=+$('#rvI').value;if(review.kind==='qari'){detect();review.cols=null}vReview()});
  const P=$('#rvP');if(P)P.oninput=()=>{$('#rvPv').textContent=(+P.value).toFixed(1)+' s'};if(P)P.onchange=()=>{review.minPause=+P.value;S.settings.minPause=review.minPause;save();detect();review.cols=null;vReview()};
  const T=$('#rvT');T.oninput=()=>{$('#rvTv').textContent=Math.round(T.value*100)+'%'};T.onchange=()=>{review.thr=+T.value;if(review.kind==='qari')S.settings.qThr=review.thr;else S.settings.thr=review.thr;save();detect();review.cols=null;vReview()};
  const w=$('#wave');w.onclick=e=>{const rc=w.getBoundingClientRect(),t=(e.clientX-rc.left)/rc.width*review.E.length*review.fr;player.a=null;player.b=null;player.q=null;au.currentTime=t;au.play().catch(()=>{});reviewTick()};
  reviewTick();renderDock();
}
function reviewTick(){
  const w=$('#wave');if(!w||!review)return;const dpr=window.devicePixelRatio||1,W=Math.round(w.clientWidth*dpr),H=Math.round(w.clientHeight*dpr);
  if(w.width!==W||w.height!==H){w.width=W;w.height=H;review.cols=null}
  const E=review.E,n=E.length,fr=review.fr,dur=n*fr,g=w.getContext('2d'),css=getComputedStyle(document.documentElement),col=k=>css.getPropertyValue(k).trim();
  if(!review.cols){const c=new Float32Array(W);for(let x=0;x<W;x++){let m=0;const a=Math.floor(x/W*n),b=Math.max(a+1,Math.floor((x+1)/W*n));for(let i=a;i<b&&i<n;i++)if(E[i]>m)m=E[i];c[x]=20*Math.log10(m+1e-7)}
    const s=Array.from(c).sort((a,b)=>a-b);review.lo=s[Math.floor(W*.05)];review.hi=s[Math.floor(W*.98)];review.cols=c}
  g.clearRect(0,0,W,H);const list=segs();
  list.forEach((s,i)=>{g.fillStyle=s.drop?'rgba(128,128,128,.15)':(i%2?'rgba(143,106,18,.10)':'rgba(143,106,18,.20)');g.fillRect(s.t0/dur*W,0,(s.t1-s.t0)/dur*W,H)});
  g.fillStyle=col('--muted');for(let x=0;x<W;x++){const v=Math.max(0,Math.min(1,(review.cols[x]-review.lo)/(review.hi-review.lo||1)));const h=Math.max(1,v*H*.9);g.fillRect(x,(H-h)/2,1,h)}
  g.fillStyle=col('--gold');for(const c of review.cuts){g.fillRect(((c.a+c.b)/2)/dur*W-dpr,0,2*dpr,H)}
  g.fillStyle=col('--forgot');g.fillRect(au.currentTime/dur*W-dpr,0,2*dpr,H);
  const t=$('#revT');if(t)t.textContent=mmss(au.currentTime);const pp=$('#revPP');if(pp)pp.textContent=au.paused?'▶':'❚❚';
  const cur=list.findIndex(s=>au.currentTime>=s.t0&&au.currentTime<s.t1);
  document.querySelectorAll('.segrow').forEach(el=>el.classList.toggle('cur',+el.dataset.i===cur));
}
async function saveReview(){
  if(review.kind==='qari'){const s=review.surah;qSave(s,{intro:review.intro,start:review.start,end:review.end,cuts:review.cuts.slice().sort((x,y)=>x.a-y.a)},review.thr);S.qari.times[s].checked=true;S.qari.times[s].approx=false;save();review=null;au.pause();toast(SN[s-1]+': timings saved');render();renderDock();return}
  const r=S.recs.find(x=>x.id===review.id);if(!r)return;const list=segs();
  const old=S.recs.filter(x=>x.src===r.id),pos={};old.forEach(o=>{if(o.markers[0].x!=null)pos[o.ayah+'|'+o.title]=o.markers[0]});
  S.recs=S.recs.filter(x=>x.src!==r.id);
  const pm=r.markers.filter(m=>!m.ayahMark&&/^Page /.test(m.label||'')).sort((a,b)=>a.t-b.t);
  const pageAt0=t=>{let p=r.startPage;for(const m of pm)if(m.t<=t+.5)p=m.page;return p};
  let n=0;

    case 'qLink':$('#qIn').click();break;
    case 'qResume':await qResume();break;
    case 'qFollowHere':S.settings.follow=true;fl.manualUntil=0;save();if(fl.state&&fl.state.p&&fl.state.p!==curPage){fl.auto=true;openPage(fl.state.p)}else drawFollow(true);break;
    case 'qResumeNo':await qResumeClear();renderDock();break;
    case 'qFollow':{const on=!(S.settings.follow!==false&&tab==='mushaf');S.settings.follow=on;save();fl.manualUntil=0;
      if(on){if(fl.state&&fl.state.p){fl.auto=true;openPage(fl.state.p)}else if(tab!=='mushaf')go('mushaf')}else drawFollow(true);renderDock();toast(on?'Following the recitation on the Mushaf':'Follow is off');break}
    case 'qRangePlay':qPlayRange(+$('#rS1').value,+$('#rA1').value,+$('#rS2').value,+$('#rA2').value);break;
    case 'qPageRange':{const [s1,a1]=$('#pqF').value.split(':').map(Number),[s2,a2]=$('#pqT').value.split(':').map(Number);qPlayRange(s1,a1,s2,a2);break}
    case 'ixRange':{const sv=+b.dataset.s;qPlayRange(sv,+$('#ixF').value,sv,+$('#ixT').value);break}
    case 'qAll':qPrepareAll();break;
    case 'qStop':if(qRun){qRun.stop=true;toast('Stopping after this surah…')}break;
    case 'qCheck':{const v=+(($('#qChk')||{}).value);if(v)openQariReview(v);break}
    case 'qUnlink':{if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again to remove all linked surahs';break}
      for(const k of Object.keys(qState().files)){await idel('audio:'+QK(+k));await idel('qenergy:'+k)}S.qari={name:S.qari.name,files:{},times:{}};
      if(String(player.key||'').startsWith('qari-')){au.pause();au.removeAttribute('src');player={id:null}}save();toast('Removed. Your phone folder is untouched.');render();renderDock();break}
    case 'ixPlayA':{const v=+(($('#ixA')||{}).value)||1;qPlayAyah(+b.dataset.s,Math.min(AY[+b.dataset.s-1],v));break}
    case 'ixFind':ixQ=($('#ixQ')||{}).value||'';ixFind();break;
    case 'ixGoA':{const v=+(($('#ixA')||{}).value)||1;openAyah(+b.dataset.s,v);break}
    case 'ixGoP':{const v=+(($('#ixP')||{}).value)||F();openPage(v);break}
    case 'goHifz':go('settings');setTimeout(()=>{const c=$('#hifzCard');if(c)c.scrollIntoView({block:'start'})},50);break;
    case 'memorize':memorize(curPage);toast('Page '+curPage+' added to your hifz');render();break;
    case 'unmemorize':if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again to remove';break}delete S.mem[curPage];if(curPage<(S.sabaqPtr||F()))S.sabaqPtr=curPage;S.today=null;save();toast('Removed from memorized');render();break;
    case 'recFirst':go('audio');startRec();break;
    case 'recPause':pauseRec();break;
    case 'recStop':stopRec();break;
    case 'goAudio':go('audio');break;
    case 'next':openPage(curPage+1);break;
    case 'prev':openPage(curPage-1);break;
    case 'zoom':zoom=zoom>1?1:1.7;render();break;
    case 'lsOpen':lsOpen();break;
    case 'lsStop':lsStop();break;
    case 'lsGo':{const ss=Math.min(114,Math.max(1,+($('#lsS')||{}).value||1)),aa=Math.min(AY[ss-1],Math.max(1,+($('#lsA')||{}).value||1));lsStart(ss,aa);break}
    case 'lsDownload':asrDownload();break;
    case 'lsDelete':if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again to delete';break}await idel('asrModel');await idel('asrOk');ASR.have=false;ASR.ses=null;toast('Listening model deleted');render();break;
    case 'lsClear':LS.flags=[];render();break;
    case 'lsAddAll':{let n=0;for(const f of LS.flags)if(f.state==='open'&&f.red){lsAdd(f);n++}toast(n+' added to mistakes');lsPaint();if(tab==='mushaf'){drawMarks();refreshMarkCard()}break}
    case 'hideLine':hideRev=Math.min(15,hideRev+1);drawCover();break;
    case 'hideAyah':hideNextAyah();break;
    case 'hideReset':hideRev=0;hidePg=curPage;drawCover();break;
    case 'hideAll':hideRev=15;drawCover();break;
    case 'planApply':{const pl=planNums();if(pl.U>0)S.settings.sabaqPerDay=Math.min(10,Math.max(1,pl.needSab));S.settings.manzilPerDay=Math.min(120,Math.max(1,pl.needMan));S.today=null;save();toast('Plan applied: '+(pl.U>0?pl.needSab+' sabaq, ':'')+pl.needMan+' manzil pages a day');render();break}
    case 'marksToggle':showMarks=!showMarks;render();break;
    case 'undo':{const a=S.marks[curPage]||[],t=ymd();for(let i=a.length-1;i>=0;i--)if(a[i].d===t){a.splice(i,1);break}save();render();break}
    case 'fixAll':(S.marks[curPage]||[]).forEach(m=>{if(!m.fixed)m.fixed=ymd()});save();toast('All marked corrected');drawMarks();refreshMarkCard();break;
    case 'clearMarks':if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again to erase';break}(S.marks[curPage]||[]).forEach(m=>undoStack.push({op:'erase',p:curPage,m}));delete S.marks[curPage];save();drawMarks();refreshMarkCard();break;
    case 'pp':if(player.qq&&player.qq.waiting){const Q=player.qq;Q.waiting=false;au.volume=1;const f=Q.after;Q.after=null;if(f)f();break}if(au.paused){if(player.b==null&&player.a!=null){player.b=isFinite(au.duration)?au.duration:null}au.play().catch(()=>{})}else au.pause();break;
    case 'back5':au.currentTime=Math.max(0,au.currentTime-5);break;
    case 'setA':player.a=au.currentTime;if(player.b!=null&&player.b<=player.a)player.b=null;renderDock();break;
    case 'setB':if(player.a==null)player.a=0;if(au.currentTime>player.a){player.b=au.currentTime;player.left=S.settings.repeat||1;au.currentTime=player.a;au.play().catch(()=>{})}renderDock();break;
    case 'loop':player.loop=!player.loop;if(player.loop&&player.b==null){player.a=player.a??0;player.b=isFinite(au.duration)?au.duration:null}renderDock();break;
    case 'speed':{const sp=[0.75,1,1.25,1.5],i=(sp.indexOf(S.settings.speed||1)+1)%sp.length;S.settings.speed=sp[i];au.playbackRate=sp[i];save();renderDock();break}
    case 'closeP':{const hadQ=!!player.qq;if(player.qq)clearTimeout(player.qq.wait);au.volume=1;au.pause();au.removeAttribute('src');player={id:null};resumeState=null;renderDock();if(tab!=='today')render();if(hadQ)await qResumeClear();break}
    case 'saveSet':{const s=S.settings,n=(id,min,max,def)=>{const v=parseInt($(id).value,10);return isNaN(v)?def:Math.min(max,Math.max(min,v))};
      s.sabaqPerDay=n('#s-sab',1,10,1);s.sabaqiPages=n('#s-sqi',1,60,20);s.manzilPerDay=n('#s-man',1,120,20);s.reviewMax=n('#s-rm',0,30,4);s.goal=n('#s-goal',5,300,45);s.remind=$('#s-rem').value||'05:30';s.ramadan=$('#s-ram').value||s.ramadan;
      s.firstPage=n('#s-fp',1,700,2);s.firstPdf=n('#s-pdf',1,2000,5);s.lastPage=n('#s-lp',s.firstPage,1000,611);
      const known=parseRanges($('#s-known').value);for(let q=F();q<=L();q++){if(known.has(q)){if(!S.mem[q])S.mem[q]={d:'known',src:'known'}}else if(S.mem[q]&&S.mem[q].src==='known')delete S.mem[q]}
      S.sabaqPtr=n('#s-sp',s.firstPage,s.lastPage,S.sabaqPtr||s.firstPage);
      urlCache.forEach(u=>URL.revokeObjectURL(u));urlCache.clear();S.today=null;save();toast('Settings saved');render();break}
    case 'persist':if(navigator.storage&&navigator.storage.persist){const ok=await navigator.storage.persist();toast(ok?'Protected. Chrome will not clear app data on its own.':'Chrome declined. Installing the app to the home screen usually allows it.')}break;
    case 'copyB':{const t=$('#s-data');try{await navigator.clipboard.writeText(t.value);toast('Backup copied')}catch(err){t.select();toast('Text selected. Use your phone’s Copy.')}break}
    case 'fileB':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='hifz-backup-'+ymd()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup file saved to Downloads');break}
    case 'restoreB':try{const v=JSON.parse($('#s-data').value);if(!v.settings||!v.pages)throw 0;S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),v);S.settings=Object.assign({},DEFAULTS.settings,v.settings);save();toast('Restored');render()}catch(err){toast('That text is not a valid backup.')}break;
    case 'reset':if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again to clear everything';break}
      for(const r of S.recs){await idel('audio:'+r.id);await idel('energy:'+r.id)}const keep=S.settings,keepQ=S.qari;S=JSON.parse(JSON.stringify(DEFAULTS));S.settings=keep;if(keepQ)S.qari=keepQ;S.pointer=keep.firstPage;S.sabaqPtr=keep.firstPage;save();toast('Cleared');render();break;
  }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(timer.on){S.minutes[ymd()]=(S.minutes[ymd()]||0)+(Date.now()-timer.start)/1000;timer.start=Date.now()}iput('state',S).catch(()=>{})}});

/* ---------- Start ---------- */
(async()=>{
  const st=await iget('state');
  if(st){S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),st);S.settings=Object.assign({},DEFAULTS.settings,st.settings)}
  curPage=(todayPlan().sabaq[0])||S.pointer;
  if(S.qari&&S.qari.prepAll)setTimeout(()=>toast('Preparing the timings was interrupted. Open Audio and tap Continue.'),1500);
  pdfIdx=await iget('pdfIdx')||null;pdfBlob=pdfIdx?await iget('pdf'):null;if(!pdfBlob)pdfIdx=null;
  try{resumeState=await iget('resume')||null}catch(e){}
  try{ASR.have=!!(await iget('asrOk'))}catch(e){}
  go('today');renderDock();
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
